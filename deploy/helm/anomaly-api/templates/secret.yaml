{{- if .Values.apiKey.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anomaly-api.fullname" . }}-api-key
  labels: {{- include "anomaly-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANOMALY_API_KEY: {{ required "apiKey.value is required when apiKey.enabled" .Values.apiKey.value | quote }}
{{- end }}
